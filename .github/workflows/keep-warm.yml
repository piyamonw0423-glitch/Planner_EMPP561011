name: Keep site warm

# Render's free tier spins the service down after ~15 min of inactivity, so the
# next visitor waits 20-50s for a cold start. This pings a lightweight health
# endpoint on a schedule to keep the instance awake. Public repo => Actions
# minutes are free and unlimited.
on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs a few minutes under
    # load, so 10 min keeps a margin under the 15-min spin-down window.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://maintenance-operating-system.onrender.com/api/health"
          echo "Pinging $URL"
          # Retry a few times because a cold start can take up to ~50s.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site is awake."
              exit 0
            fi
            sleep 15
          done
          echo "Health check did not return 200 after retries."
          exit 1
