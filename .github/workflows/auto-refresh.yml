name: Auto refresh data

# Pulls new Work Order snapshots from the Google Sheet into the database on a
# schedule, so the dashboard updates itself without an admin clicking Import.
# The import is INCREMENTAL (scripts/import-sheet.ts -> runGvizIncrementalImport):
# it asks the sheet which Data_Dates exist and downloads ONLY the ones not yet
# stored, so a run with no new date is a cheap no-op. It also rebuilds the
# summary layer and prunes old snapshots automatically (same code path as a
# manual import). Public repo => Actions minutes are free and unlimited.
#
# REQUIRED SETUP (one-time, done by a human in GitHub):
#   Repo → Settings → Secrets and variables → Actions
#     • New repository SECRET  DATABASE_URL = <the Supabase connection string>
#     • (optional) New repository VARIABLE  SHEET_URL = <sheet URL to import>
#       If SHEET_URL is not set, the script uses its built-in default sheet.
on:
  schedule:
    # 01:30 UTC daily = 08:30 in Thailand (ICT). Data is pulled ~weekly, but
    # running daily catches a new Data_Date the day it appears; days with no new
    # date do almost nothing. Change this cron to adjust the cadence.
    - cron: "30 1 * * *"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Never let two refreshes overlap (e.g. a slow run + the next schedule).
concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level so `prisma generate` (npm ci postinstall) also sees DATABASE_URL.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SHEET_URL: ${{ vars.SHEET_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import new snapshots
        run: npm run import
